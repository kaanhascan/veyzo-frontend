name: Veyzo Frontend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bagimliliklari Yukle (Install Dependencies)
        run: npm ci

      - name: Derleme Kontrolu (Build Check)
        run: npm run build

